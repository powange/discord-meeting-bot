# Stack Portainer (déploiement depuis le dépôt Git).
# Variables à définir dans Portainer : DISCORD_TOKEN, POSTGRES_PASSWORD, LITELLM_MASTER_KEY (+ optionnelles ci-dessous).
name: meeting-bot

services:
  bot:
    image: ghcr.io/powange/discord-meeting-bot:${BOT_TAG:-latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN requis}
      # Mot de passe alphanumérique : il est inséré tel quel dans l'URL.
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/meetingbot
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      # Résumés (phase 3) : LiteLLM de la stack, ou directement un Ollama (http://hôte:11434/v1)
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-summary}
      # Décommenter pour utiliser un fichier de configuration (surcharges par serveur, etc.)
      # CONFIG_PATH: /app/config/config.yaml
    volumes:
      # Pistes audio des réunions (prévoir de la place : ~1 Mo / 10 min / participant)
      - recordings:/data
      # Décommenter pour utiliser un fichier de configuration :
      # - ${CONFIG_DIR:-/srv/meeting-bot/config}:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meetingbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d meetingbot']
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.105.0
    restart: unless-stopped
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY requis}
    volumes:
      # Fichier à créer sur l'hôte à partir de config/litellm.example.yaml
      - ${LITELLM_CONFIG:-/srv/meeting-bot/litellm.yaml}:/app/config.yaml:ro

volumes:
  pgdata:
  recordings:
