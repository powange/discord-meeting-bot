# Configuration du bot. Les secrets ne sont jamais écrits ici : ${VAR} ou ${VAR:-défaut}
# sont remplacés par les variables d'environnement au démarrage. Le fichier est validé
# au démarrage ; toute clé inconnue est refusée.
#
# Sans fichier, le bot fonctionne avec DISCORD_TOKEN et DATABASE_URL seuls.

discord:
  token: ${DISCORD_TOKEN}
  # Serveurs de test : commandes enregistrées instantanément sur ces serveurs plutôt qu'en global.
  commandGuildIds: []

database:
  url: ${DATABASE_URL}

logLevel: ${LOG_LEVEL:-info}

# Propriétaires du bot (ids Discord) : seuls à pouvoir modifier les serveurs IA depuis Discord.
# Le propriétaire de l'application Discord (ou son équipe) est toujours reconnu.
owners: []

# Hôtes que le bot a le droit d'appeler pour l'IA (transcription, résumé). Vide : aucune restriction.
# Noms exacts, *.domaine, IPv4 ou plages CIDR. Vérifié à l'enregistrement et à chaque appel,
# après résolution DNS ; aucune redirection n'est suivie.
ai:
  allowedHosts: []
  # allowedHosts: ["*.tailnet.ts.net", "192.168.1.0/24", "100.64.0.0/10"]

# Données locales (pistes audio). Dans Docker : /data (volume).
dataDir: ${DATA_DIR:-data}
# ffmpeg : vide = ffmpeg-static en développement, `ffmpeg` de l'image en production.
# ffmpegPath: /usr/bin/ffmpeg

scheduler:
  tickSeconds: 30

# Valeurs par défaut pour tous les serveurs…
defaults:
  # Réglages initiaux d'un serveur. Ils ne servent qu'à sa première utilisation :
  # ensuite, ils se modifient avec /config (et c'est la BDD qui fait foi).
  seed:
    timezone: Europe/Paris
    locale: fr
    reminderOffsetsMin: [1440, 15] # J-1 et 15 min avant
    defaultDurationMin: 60
    autoRecordDefault: false
  # Enregistrement (phase 2)
  recording:
    autoJoinLeadMin: 2 # en auto, le bot rejoint le vocal 2 min avant l'heure
    endWhenEmptyMin: 5 # vocal vide depuis 5 min : clôture de la réunion (et de l'enregistrement), jamais sur l'heure de fin
    silenceMs: 1500 # silence qui clôt une prise de parole
    decryptionFailureTolerance: 48 # DAVE : échecs de déchiffrement tolérés avant réinitialisation

  # Transcription (phase 3) : backends par ordre de priorité, bascule au suivant en cas d'erreur,
  # de délai dépassé ou de serveur occupé. Vibe : https://github.com/thewh1teagle/vibe (vibe-server).
  transcription:
    language: fr
    # prompt: "Vocabulaire du groupe : CA, AG, trésorerie…" # aide la reconnaissance des noms propres
    backends:
      - name: vibe-pc-main
        type: vibe # vibe-server serve <modèle> --host 0.0.0.0 --port 8080 --exit-with-parent false
        url: http://pc-main.tailnet:8080
        timeoutSec: 600
      - name: speaches-secours
        type: openai # serveur compatible OpenAI (speaches, faster-whisper-server…)
        url: http://pc-secours.tailnet:8000/v1
        model: Systran/faster-whisper-large-v3
        # apiKey: ${SPEACHES_KEY}
    maxGapSec: 4 # prises de parole d'une même personne à moins de 4 s : transcrites ensemble
    maxBlockMin: 5

  # Résumé (phase 3) : LiteLLM (recommandé) ou Ollama directement (http://hôte:11434/v1).
  llm:
    baseUrl: ${LLM_BASE_URL:-http://litellm:4000/v1}
    apiKey: ${LLM_API_KEY:-}
    model: ${LLM_MODEL:-summary}
    chunkTokens: 6000 # au-delà, résumé en plusieurs passes (morceaux puis fusion)
    timeoutSec: 600

# … surchargées serveur par serveur (fusion profonde avec `defaults`).
guilds: {}
#  "123456789012345678":
#    seed:
#      defaultDurationMin: 90
