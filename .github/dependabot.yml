# Mises à jour proposées en pull request (rien n'est fusionné automatiquement).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  # Images de la stack (postgres, rclone, litellm) épinglées dans docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
