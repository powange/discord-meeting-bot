# Mises à jour proposées en pull request (rien n'est fusionné automatiquement).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Node : seules les versions paires sont maintenues longtemps (LTS) ; montée majeure à la main.
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Images de la stack (postgres, rclone, litellm) épinglées dans docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Une version majeure de PostgreSQL ne relit pas les données de la précédente : montée à la
      # main, par sauvegarde et restauration (docs/exploitation.md).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
